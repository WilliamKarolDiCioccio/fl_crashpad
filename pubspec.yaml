name: fl_crashpad
description: "Native crash reporting for Flutter with Google Crashpad: sanitised minidumps of crashes the Dart VM never sees, on desktop, Android and iOS, for any minidump backend."
version: 0.1.0
repository: https://github.com/WilliamKarolDiCioccio/fl_crashpad
topics:
  - crash-reporting
  - crashpad
  - minidump
  - ffi
  - privacy
# Declared rather than detected: pub.dev reads a plugin's platforms from the
# `flutter:` block, which names only the desktops, because only they have
# platform files — Android and iOS travel entirely through the build hook.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:
funding:
  - https://buymeacoffee.com/Wilielmus

# **No path from `lib/` reaches `package:flutter`, although this is a Flutter
# plugin.** The `flutter:` block below is only there so that Flutter runs the
# desktop build files that place the handler; the Dart half is `dart:ffi` and
# `dart:io`. That is what lets the package's own suite run under `dart test`,
# crash tests and all, and what lets the build hook import `lib/src/build/`.
# The `no-flutter` hook in .pre-commit-config.yaml checks it.
environment:
  sdk: ^3.11.5
  flutter: ">=3.41.0"

# The first two are the build hook's: it verifies a downloaded archive's
# sha256 and unpacks the tar.gz itself, the same on every host. `hooks` and
# `code_assets` stay on 1.x, which the Flutter 3.41 toolchain speaks.
dependencies:
  archive: ^4.0.0
  code_assets: ^1.0.0
  crypto: ^3.0.0
  ffi: ^2.2.0
  hooks: ^1.0.2

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0

flutter:
  plugin:
    platforms:
      linux:
        ffiPlugin: true
      macos:
        ffiPlugin: true
      windows:
        ffiPlugin: true
