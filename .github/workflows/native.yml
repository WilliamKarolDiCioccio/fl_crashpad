# The native half, built from source on every platform it ships for, and then
# proved: each job runs the package's own tests against what it just built —
# real crashes, real reports — before anything is kept.
#
# Every pull request and push runs the matrix. A tag `native-v<version>`
# additionally publishes: the archives go to a draft release, with the
# command that records their digests in native/artifacts.lock.json. The lock
# is updated by hand from that command and released with the package, so a
# digest is never trusted that nobody looked at.
#
# The glibc floor of a Linux archive is the glibc it was built against, which
# is why the Linux jobs run on the oldest runners there are.
name: native

on:
  push:
    branches: [main]
    tags: ['native-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-22.04-arm }
          - { target: windows-x64, runner: windows-2022 }
          - { target: windows-arm64, runner: windows-11-arm }
          - { target: macos-universal, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Flutter version
        id: fvm
        shell: bash
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        if: matrix.target != 'windows-arm64'
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      # Flutter publishes no Windows-on-Arm SDK archive, so the action finds
      # nothing to install there. A checkout of the release tag is the same
      # SDK, and fetches the Dart SDK for the machine it runs on.
      - name: Flutter, from its release tag
        if: matrix.target == 'windows-arm64'
        shell: bash
        run: |
          git clone --depth 1 --branch "${{ steps.fvm.outputs.version }}" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Crashpad's libcurl upload transport needs the headers to build; at run
      # time it dlopens libcurl, so the archive does not depend on it.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libcurl4-openssl-dev zlib1g-dev \
            ninja-build libgtk-3-dev xvfb

      - name: Build the native half
        shell: bash
        run: |
          dart pub get
          dart run tool/build_native.dart --target ${{ matrix.target }} --install \
            --out dist

      - name: Package tests against it
        run: dart test

      - name: Example, headless crash
        if: runner.os == 'Linux'
        working-directory: example
        run: |
          flutter build linux --release
          bundle=build/linux/$(uname -m | sed 's/x86_64/x64/;s/aarch64/arm64/')/release/bundle
          test -x "$bundle/lib/crashpad_handler"
          db=$(mktemp -d)
          xvfb-run -a "$bundle/fl_crashpad_example" --database="$db" --crash=segfault || true
          for i in $(seq 1 100); do
            ls "$db"/*/*.dmp >/dev/null 2>&1 && break
            sleep 0.1
          done
          ls -la "$db"/*/*.dmp

      # The Windows database keeps every report in reports/, not by state.
      - name: Example, headless crash
        if: runner.os == 'Windows'
        working-directory: example
        shell: bash
        run: |
          flutter build windows --release
          exe=$(find build/windows -path '*/runner/Release/fl_crashpad_example.exe')
          bundle=$(dirname "$exe")
          test -f "$bundle/crashpad_handler.exe"
          test -f "$bundle/crashpad_wer.dll"
          # The app is given a Windows path; the shell globs the POSIX one.
          db=$(mktemp -d)
          "$exe" --database="$(cygpath -w "$db")" --crash=segfault || true
          for i in $(seq 1 100); do
            ls "$db"/reports/*.dmp >/dev/null 2>&1 && break
            sleep 0.1
          done
          ls -la "$db"/reports/*.dmp

      - name: Example, macOS build
        if: runner.os == 'macOS'
        working-directory: example
        run: |
          flutter build macos --release
          app=build/macos/Build/Products/Release/fl_crashpad_example.app
          handler="$app/Contents/Frameworks/fl_crashpad.framework/Versions/A/Helpers/crashpad_handler"
          test -x "$handler"
          lipo -archs "$handler"
          codesign --verify --strict --deep "$app"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  # Android and iOS, whose archives hold only libraries (see
  # lib/src/build/native_artifacts.dart). Android builds on Linux with the
  # runner's NDK, for both ABIs; x64 is then proved on an emulator by
  # tool/android_e2e.dart — real crashes, sanitised, and sent. iOS builds on
  # a Mac; its end-to-end run is still to be written and done on one.
  mobile:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: android-x64, runner: ubuntu-22.04, e2e: true }
          - { target: android-arm64, runner: ubuntu-22.04 }
          - { target: ios-arm64, runner: macos-14 }
          - { target: ios-simulator, runner: macos-14 }
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned Flutter version
        id: fvm
        shell: bash
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the native half
        shell: bash
        run: |
          dart pub get
          # The runner's newest NDK; build_native.dart otherwise looks under
          # ANDROID_HOME itself.
          if [ -n "${ANDROID_NDK_LATEST_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          fi
          dart run tool/build_native.dart --target ${{ matrix.target }} --install \
            --out dist

      - name: Example, Android build
        if: startsWith(matrix.target, 'android')
        working-directory: example
        run: |
          flutter build apk --release \
            --target-platform ${{ matrix.target }}
          unzip -l build/app/outputs/flutter-apk/app-release.apk \
            | grep -E 'libfl_crashpad_native.so|libcrashpad_handler_trampoline.so'

      - name: Enable KVM
        if: matrix.e2e
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android end to end, on an emulator
        if: matrix.e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: dart run tool/android_e2e.dart

      - name: Example, iOS build
        if: startsWith(matrix.target, 'ios')
        working-directory: example
        run: |
          if [ "${{ matrix.target }}" = ios-simulator ]; then
            flutter build ios --simulator --debug
            app=build/ios/iphonesimulator/Runner.app
          else
            flutter build ios --release --no-codesign
            app=build/ios/iphoneos/Runner.app
          fi
          find "$app/Frameworks" -maxdepth 2 -name 'fl_crashpad_native*' | grep .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: [build, mobile]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Digests, and the command that records them
        run: |
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
          {
            echo 'Record these in the lock, then commit and release the package:'
            echo
            echo '```sh'
            printf 'dart run tool/update_lock.dart'
            while read -r digest file; do
              target=$(echo "$file" | sed -E 's/^fl_crashpad-native-[^-]+-(.*)\.tar\.gz$/\1/')
              printf ' \\\n  %s=%s' "$target" "$digest"
            done < SHA256SUMS
            echo
            echo '```'
          } > ../NOTES.md
          cat ../NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: NOTES.md
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
