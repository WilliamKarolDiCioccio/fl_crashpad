# Hooks for fl_crashpad.
#
# Every Dart hook goes through `fvm`. The toolchain is pinned in .fvmrc and
# `flutter`/`dart` are deliberately not on PATH, so a hook calling a bare
# `dart` would either fail outright or — worse — quietly use a different SDK
# than the one the package is pinned to.
#
# The tests need the native half in the artifact cache: build it once with
# `fvm dart run tool/build_native.dart --install` (see CLAUDE.md).
#
#   pre-commit install          once, per clone
#   pre-commit run --all-files  to sweep the whole tree

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # Generated by tool/update_lock.dart, and compared byte for byte by a test.
        exclude: ^native/artifacts\.lock\.
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
      - id: check-added-large-files
        args: ['--maxkb=2048']

  - repo: local
    hooks:
      # Checked, never applied. A hook that rewrites a file under you turns one
      # failed commit into two.
      - id: dart-format
        name: dart format
        entry: fvm dart format --output=none --set-exit-if-changed
        language: system
        types: [dart]

      - id: analyze
        name: analyze
        entry: fvm dart analyze --fatal-infos
        language: system
        types: [dart]
        pass_filenames: false

      - id: test
        name: test
        entry: fvm dart test
        language: system
        files: \.(dart|cc|h|gn|json)$
        pass_filenames: false

      - id: example-analyze
        name: analyze · example
        entry: bash -c 'cd example && fvm flutter analyze --fatal-infos'
        language: system
        types: [dart]
        pass_filenames: false

      - id: example-test
        name: test · example
        entry: bash -c 'cd example && fvm flutter test'
        language: system
        types: [dart]
        pass_filenames: false

      # lib/ reaches no Flutter, checked rather than trusted — as in
      # dart_read_time. `tail -n +3` drops FVM's SDK banner, which mentions
      # Flutter and would make this fail for the wrong reason.
      - id: no-flutter
        name: no path to package:flutter
        entry: bash -c '! (fvm dart pub deps --style=list | tail -n +3 | grep -qi flutter)'
        language: system
        types: [yaml]
        pass_filenames: false
